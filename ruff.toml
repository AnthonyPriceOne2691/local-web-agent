# Корневой конфиг ruff: покрывает всё, что вне `backend/` — `cli/` и `scripts/`.
#
# Зачем он появился (поставка lint-contour, 2026-08-01). Конфига в корне не было
# вообще, а ruff ищет ближайший конфиг вверх по дереву. Поэтому:
#   * `backend/**` брал `backend/pyproject.toml` — канонный select, всё честно;
#   * `cli/**` и `scripts/**` не находили ничего и линтовались **дефолтным**
#     набором ruff (E4/E7/E9/F) — то есть канонные правила там не работали никогда,
#     хотя pre-commit показывал зелёное. Заодно `per-file-ignores` для `../cli/**`
#     из backend-конфига не применялся ни разу: он срабатывал только при запуске
#     из `backend/`, а pre-commit гоняет из корня.
#
# `extend` — чтобы правила жили в ОДНОМ месте: набор, ignore-список и пороги
# сложности берутся из backend-конфига, здесь только то, что специфично для корня.
# Унаследованные `per-file-ignores` вида `app/...` тут просто ни на что не матчатся.
extend = "backend/pyproject.toml"

# Phase 0 spike — сознательное исключение из стандартов (CLAUDE.md § Стандарты):
# артефакт замера, который не трогают без нужды. Единственное место, где это
# исключение записано машиночитаемо, а не только словами.
# Механика КОНТУРА выведена из-под линтеров проекта, и это тот же принцип,
# по которому она уже исключена из grep-гейтов (`TOOLING_RE`): скрипты
# контура не продуктовый код проекта — они приезжают из канона, живут по
# его правилам и настраиваются через env (CQG §6).
# Замер, из-за которого правило понадобилось: на коммите развёртывания
# `ruff --fix` ПЕРЕПИСАЛ 31 канонный скрипт, то есть развёрнутый payload
# молча разошёлся бы с источником и следующее обновление начиналось бы
# с раскопок. Свои скрипты проекта (`scripts/spike`, прочее) под линтером
# остаются — исключены ровно канонные пути.
extend-exclude = [
    "scripts/spike",
    "scripts/lint",
    "scripts/delivery_",
    "scripts/okf_",
    "scripts/merge_guard.sh",
]

[lint.per-file-ignores]
"cli/**" = ["B008"]  # typer.Option в defaults — идиома typer

# Заморозок сложности для scripts/ здесь БОЛЬШЕ НЕТ: поставка scripts-canon
# разобрала все четыре гейт-скрипта (delivery_check.main была 47 при пороге 10).
# Не возвращать: новый гейт пишется проверками-функциями, а не одной main().
