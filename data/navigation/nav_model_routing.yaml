# Маршрутизация nav-решений между лёгкой и тяжёлой моделью (doc 16).
#
# Замер 2026-07-31 (qwen3:8b vs qwen3:14b на одном коде): лёгкая модель вдвое
# быстрее там, где решение локально по DOM (какое поле заполнить, какую кнопку
# нажать), и систематически хуже там, где надо выбрать ссылку по смыслу —
# 3 прогона из 3 на «найди самую полную статью» дали G-H2 и лишний хоп в 404.
# Поэтому маршрут зависит от КЛАССА решения, а не от задачи целиком.
#
# action_keywords: задача прямо просит действие на странице. Только вместе с
# наличием интерактивных элементов на странице это даёт «локальное по DOM»
# решение. Ошибаться безопасно в сторону тяжёлой модели: она медленнее, но не
# уводит агента с пути.
action_keywords:
  - fill
  - fill in
  - fill out
  - submit
  - type in
  - enter the
  - log in
  - login
  - sign in
  - checkout
  - check out
  - place order
  - order
  - pay
  - buy
  - purchase
  - click
  - press
  - заполн
  - впиши
  - введи
  - отправ
  - нажм
  - нажат
  - жми
  - войди
  - войти
  - логин
  - авториз
  - оформ
  - заказ
  - куп
  - оплат
  - оплач
  - корзин
