support:
  # Слуги интента — это HTTP-ПРОБЫ (F1), каждая стоит запроса: замер на живых магазинах
  # дал 80 s на 20 слугов при VPN. Поэтому здесь только самые частотные имена раздела, а
  # полный список для БЕСПЛАТНОГО сопоставления ссылок лежит ниже в `help_desk`.
  - /support
  - /help
  - /faq
  - /shipping
  - /delivery
  - /returns
  - /customer-service
  - /warranty

help_desk:
  # Справка и обслуживание клиента — СТРУКТУРА сайта, а не предметная область: у магазина,
  # у SaaS и у новостного сайта раздел устроен одинаково, и в нём лежат контакты, условия и
  # ответы на вопросы. Замечание владельца 07.08: агент должен знать эти разделы и
  # обращаться к ним, когда прямого ответа на странице нет.
  #
  # Список длиннее слугов и это не расточительство: сопоставление ссылки со строкой ничего
  # не стоит, в отличие от пробы.
  - /support
  - /help
  - /help-center
  - /helpdesk
  - /faq
  - /faqs
  - /customer-service
  - /customer-care
  - /knowledge-base
  - /shipping
  - /delivery
  - /returns
  - /refund
  - /warranty
  # RU
  - /podderzhka
  - /pomosch
  - /vopros
  - /dostavka
  - /vozvrat
  - /garantiya

