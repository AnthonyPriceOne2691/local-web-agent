# Intent keyword hints (used by intent.py — not URL paths)
# Matching: casefold + substring («вакансии» матчится по «ваканс»).
# RU-ключи обязательны: задачи пользователя формулируются по-русски (UC-1/UC-2, doc 24).
intent_keywords:
  contact: [contact, email, phone, sales, support, reach, write us, redaksi, hubungi,
            контакт, почт, email, телефон, связаться, написать, продаж, поддержк]
  pricing: [pricing, price, plan, enterprise, cost, subscription,
            цена, цены, тариф, прайс, стоимост, подписк, план]
  about: [about, team, company, who we are,
          о нас, о компании, команда, кто мы]
  careers: [jobs, careers, hiring, vacancy, work with us,
            ваканс, работа у нас, найм, карьер]
  docs: [documentation, docs, api, develop, contribut, guide,
         документац, апи, разработ, вклад]
  design_audit: [design, layout, colors, fonts, ui, visual, look and feel,
                 дизайн, вёрстк, верстк, макет, цвет, шрифт, внешний вид, выгляд]
  site_map: [map site, page types, site structure, all pages, sections,
             структура сайта, карта сайта, раздел, типы страниц]
  support: [shipping, delivery, return, refund, warranty, faq, help desk, customer service,
            доставк, возврат, гарант, поддержк, помощ, часто задаваем,
            lieferung, versand, rückgabe, garantie, hilfe, kundenservice]
  content_search: [article, blog, guide, post, betting,
                   статья, статьи, блог, гайд, пост, найди текст, ставки, обзор,
                   # DE — добавлено по живому прогону T-3p: без них «Finde eine Anleitung…»
                   # уходило в generic, а с ним терялись блог-слуги, блок article и канонный
                   # синтез. Словарь растёт по мере испытаний на новых языках, это его цена.
                   anleitung, artikel, ratgeber, beitrag]

# Служебные слова задач: сигналом темы НЕ считаются (RU+EN). Один словарь на двух
# потребителей — sitemap-фильтр (<loc> не отличает «найди статью» от темы) и оценка
# ссылок. Без него транслитерация слов задачи начинала ловить чужие пути: «статью» →
# `stat` совпадало с `/stat/football`, и страница статистики становилась «по теме»
# (найдено при починке первого хопа, doc 26 § T-3g).
task_stopwords:
  - find
  - article
  - about
  - with
  - from
  - what
  - where
  - this
  - that
  - page
  - site
  - website
  - compare
  # Английские служебные слова: без них «more» из «compare which store explains ... more
  # clearly» становилось темой и давало «Learn More About Teensy» полный вес (T-3o).
  - more
  - which
  - clearly
  - please
  - explain
  - explains
  # «at home» — уточнение места в задаче («how to bake bread at home»), а подпись «Home»
  # стоит в меню почти каждого сайта: слово давало тему ГЛАВНОЙ странице и разделу /home
  # (на food52 шесть ссылок «Дом и интерьер» обошли раздел выпечки). T-3q.
  - home
  # Немецкие служебные: та же история, что с `more` — «Seite» и «Thema» из формулировки
  # задачи совпадали бы с пагинацией `/seite/2` и с рубриками (T-3p).
  - eine
  - einen
  - welche
  - welches
  - seite
  - seiten
  - thema
  - selbst
  - finde
  - finden
  - vergleiche
  - vergleich
  - erklärt
  - gründlicher
  - besser
  # `guide` был служебным в sitemap-фильтре и остаётся им: жанр «руководство» ловится
  # словарём интента (`content_search`), а не словом задачи.
  - guide
  - найди
  - найти
  - статью
  - статья
  - сайт
  - сайте
  - каждом
  - текст
  - сравни
  - полнее
  - раскрыта

