# Фразы, которые бэкенд сочиняет в переписку, на двух языках.
#
# Правило (решение владельца 2026-08-03): **ответ идёт на языке запроса** — русский
# вопрос получает русский ответ, английский английский. Причём это касается не только
# прозы модели, но и НАШИХ строк внутри сообщения: иначе получается смесь, из-за которой
# правило и переписывалось («How they scored:» английской строкой над русским текстом).
#
# Что сюда НЕ входит: подписи интерфейса (кнопки, табы, заголовки карточек, статусы) —
# они остаются английскими всегда, это мебель интерфейса, а не ответ (doc 17 § Словарь).
#
# Язык определяется по самому запросу (наличие кириллицы), без обращения к модели:
# определение должно быть дешёвым и одинаковым при каждом прогоне.

en:
  winner: "Best of the bunch: {label} — {reason}"
  scored: "How they scored: {scores}"
  left_out: "Left out: {items}"
  none_worked: "None of the sites worked out: {items}"
  stopped_before_compare: "Stopped before I could compare the sites."
  report_saved: "The full write-up is saved as {name}."
  out_of_time_comparing: "Out of time for this chat — comparing what I managed to read."
  out_of_time: "Out of time for this chat."
  reading_site: "Reading {site} — site {index} of {total}"
  reading: "Reading {site}"
  done: "done"
  cut_short: >-
    Reading was cut short by the agent's own limits, not by the site lacking content —
    {parts}.
  not_opened: "pages not opened: {items}"
  ended_early: "crawl ended early after {pages} page(s) by own rule ({rule})"
  # Та же оговорка, но в ИТОГОВОМ ответе: до T-3f она жила только в разборе каждого
  # сайта, а человек читает сообщение сравнения — и видел «ничего не найдено» там,
  # где обход оборвался на 3 страницах из 12 (doc 26 § T-3f).
  reading_cut: >-
    I did not read everything: {items} — so "nothing found" here can mean "not read
    far enough", not "not on the site".
  # Сайт прочитан, а ответ не собрался — это не «сайт не читается» (T-3h).
  read_but_no_answer: "read {pages} page(s), but the answer never came together — {detail}"
  no_page_opened: "not a single page opened"

ru:
  winner: "Лучший из всех: {label} — {reason}"
  scored: "Оценки: {scores}"
  left_out: "Не вошли: {items}"
  none_worked: "Ни один сайт не удалось прочитать: {items}"
  stopped_before_compare: "Остановлено до того, как я успел сравнить сайты."
  report_saved: "Полный разбор сохранён в {name}."
  out_of_time_comparing: "Время этого чата вышло — сравниваю то, что успел прочитать."
  out_of_time: "Время этого чата вышло."
  reading_site: "Читаю {site} — сайт {index} из {total}"
  reading: "Читаю {site}"
  done: "готово"
  cut_short: >-
    Чтение прервали мои собственные ограничения, а не отсутствие материала на сайте —
    {parts}.
  not_opened: "не открыты страницы: {items}"
  ended_early: "обход прекращён после {pages} стр. по своему же правилу ({rule})"
  reading_cut: >-
    Прочитал не всё: {items} — поэтому «ничего не найдено» здесь может значить «не
    дочитал», а не «на сайте нет».
  read_but_no_answer: "прочитано {pages} стр., но ответ не собрался — {detail}"
  no_page_opened: "ни одна страница не открылась"

# Почему сайт не попал в сравнение. Раньше строка начиналась со статуса кода
# (`failed: …`) — читателю это ничего не говорит.
exclusion:
  en:
    failed: "couldn't be read"
    blocked: "blocked us"
    not_found: "had nothing on the topic"
    partial: "was only partly readable"
    canceled: "was stopped"
  ru:
    failed: "не удалось прочитать"
    blocked: "закрылся от нас"
    not_found: "ничего по теме не нашлось"
    partial: "прочитался только частично"
    canceled: "остановлен"

# Техническая причина → человеческая. Нераспознанное отбрасывается целиком: лучше
# «не удалось прочитать» без деталей, чем стек Playwright в переписке.
technical:
  en:
    timeout: "the site did not respond in time"
    dns: "the address could not be resolved"
    connection: "the connection failed"
    browser_closed: "the browser was closed"
    robots: "robots.txt does not allow it"
    never_loaded: "the page never finished loading"
    kept_reloading: "the page kept reloading"
    # Локальная модель — не сайт. До T-3h её таймаут выдавался за молчание сайта.
    llm_timeout: "the local model did not answer in time"
    llm_failed: "the local model could not put an answer together"
  ru:
    timeout: "сайт не ответил за отведённое время"
    dns: "адрес не разрешился"
    connection: "соединение не установилось"
    browser_closed: "браузер закрыли"
    robots: "robots.txt это запрещает"
    never_loaded: "страница так и не догрузилась"
    kept_reloading: "страница всё время перезагружалась"
    llm_timeout: "локальная модель не ответила за отведённое время"
    llm_failed: "локальная модель не смогла собрать ответ"
