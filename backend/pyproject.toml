[project]
name = "local-web-agent-backend"
version = "0.1.0"
description = "Local Web Agent — Layer 1 crawl worker (Phase 1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "playwright>=1.49",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "tldextract>=5.0",
  "rapidfuzz>=3.0",
  "jinja2>=3.1",
  "typer>=0.15",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",   # CQG §3.6: направление зависимостей между слоями
  "pre-commit>=3.8",      # CQG §4: оркестрация гейтов
  "detect-secrets>=1.5",  # CQG §2.7: секреты в git — механическая проверка
]
gdocs = [  # Tier 0 sink (doc 25): экспорт в Google Docs — optional, cloud carve-out
  "google-api-python-client>=2.100",
  "google-auth>=2.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# --- mypy (CQG §2.2): STRICT, без единого `[[overrides]]`. Путь сюда прошли за
# две поставки: legacy-debt снял 39 ошибок базового режима, mypy-strict — ещё 103
# (81 из них голые `dict`/`list` в сигнатурах). Заглушек нет: каждый `type: ignore`
# в коде обязан нести причину, иначе его снимет warn_unused_ignores.
[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
implicit_reexport = true               # facade-модули с re-export
ignore_missing_imports = true          # playwright/google-либы без стабов
follow_imports = "silent"
warn_unused_ignores = true
exclude = ["tests/", ".venv/", "scripts/"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 110          # проектный стиль (канон CQG предлагает 100 — не ломаем историю)
target-version = "py312"
extend-exclude = [".venv", "venv", "__pycache__"]

# Набор правил — по CODE_QUALITY_GATES.md §2 (канонный select); ignore-список канона
# плюс проектные заморозки легаси (помечены TODO — тают по мере правки файлов).
[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","C4","C90","SIM","RUF","ASYNC","S","PT","RET","PIE","PL","TRY400","DTZ"]
ignore = [
    "E501",                 # длину разрулит форматтер
    "S101",                 # assert разрешён
    "S104","S105","S106","S301","S311","S324","S603","S607",  # bandit-шум / осознанные кейсы
    "PLR0913",              # too-many-args — DI-конструкторы
    "PLR2004",              # magic-value — шумно
    "B008",                 # DI-объект как default (typer.Option/FastAPI Depends)
    "RUF001","RUF002","RUF003",  # ambiguous unicode — проза в комментариях русская
    "PLC0415",              # import-outside-top-level — осознанный lazy-import (optional extras)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"../cli/**" = ["B008"]  # typer.Option в defaults — идиома typer
# TODO(legacy, тающий список — CQG §1 baseline-ratchet): пере-снимать ВНИЗ по мере
# правки этих модулей; новый код держится на канонных правилах без исключений.
# Сложность (C901/PLR09xx) — разбить при следующем рефакторинге модуля.
"app/orchestrator/loop.py" = ["C901", "PLR0912", "PLR0915"]
# Тот же долг сложности, что был у loop.py: DECIDE-стадия переехала в decide.py
# при разгрузке файла — заморозка перенесена, а не добавлена заново.
# Растоплено поставкой scripts-canon (2026-08-02): vision_batch, sitemap, snapshot и
# compare_synthesizer уже НЕ нарушают пороги — заморозки сняты, и если сложность
# вернётся, гейт скажет об этом сразу. Ратчет обязан таять, иначе он врёт о долге.
# Молчаливое подавление исключений разобрано поставкой legacy-debt (2026-07-27):
# 20 сайтов получили осмысленные логи или `# silent-ok:` с причиной. Здесь остались
# только точки, где подавление штатное и объяснено в коде.
# S112: перебор CMP-селекторов — «не нашёл» это штатная ветка цикла, не сбой
# (итог перебора возвращается наверх и попадает в metadata.consent).
"app/browser/playwright_session.py" = ["S112", "ASYNC240", "RET503"]
"app/llm/ollama_client.py" = ["SIM105"]
"app/sinks/gdocs.py" = ["N818"]  # GdocsUnavailable — переименование ломает публичный API
"tests/**/*.py" = ["S","PLR2004","PLR0915","PLR0912","C901","PLC0415","B017","PT011","PT012","PT018","N806","N803","N802","E402","SIM117","PT006","E741","PLW0108","DTZ","RUF059","C408","ASYNC109","ASYNC240","N817"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
