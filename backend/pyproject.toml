[project]
name = "local-web-agent-backend"
version = "0.1.0"
description = "Local Web Agent — Layer 1 crawl worker (Phase 1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "playwright>=1.49",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "tldextract>=5.0",
  "rapidfuzz>=3.0",
  "jinja2>=3.1",
  "typer>=0.15",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]
gdocs = [  # Tier 0 sink (doc 25): экспорт в Google Docs — optional, cloud carve-out
  "google-api-python-client>=2.100",
  "google-auth>=2.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"../cli/**" = ["B008"]  # typer.Option в defaults — идиома typer

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
